name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch:

permissions:
  actions: write   # needed so the job can re-enable itself

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Query Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          URL=$(echo "$SUPABASE_URL" | tr -d '[:space:]')
          KEY=$(echo "$SUPABASE_ANON_KEY" | tr -d '[:space:]')
          curl --fail --silent --show-error \
            --max-time 30 --retry 3 --retry-delay 10 \
            -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "apikey: $KEY" \
            -H "Authorization: Bearer $KEY" \
            "$URL/rest/v1/portfolio_content?select=id&limit=1"

      - name: Reset GitHub's 60-day inactivity timer
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
        run: |
          FILE=$(basename "${WORKFLOW_REF%%@*}")
          echo "Re-enabling $FILE"
          gh workflow enable "$FILE" --repo "${{ github.repository }}"

name: Keep Supabase Alive

on:
  schedule:
    # Runs every 3 days at 12:00 UTC
    - cron: '0 12 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST API
        run: |
          CLEAN_URL=$(echo "${{ secrets.SUPABASE_URL }}" | tr -d '[:space:]')
          CLEAN_KEY=$(echo "${{ secrets.SUPABASE_ANON_KEY }}" | tr -d '[:space:]')
          
          curl -f -s -S -o /dev/null -w "HTTP Status: %{http_code}\n" \
            -H "apikey: $CLEAN_KEY" \
            -H "Authorization: Bearer $CLEAN_KEY" \
            "$CLEAN_URL/rest/v1/"
